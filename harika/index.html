<!DOCTYPE html>
<html>
<head>
    <title>Student Marks Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #173b67;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 8px;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        button {
            background: #173b67;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <h1>Student Marks Calculator</h1>

    <div class="container">

        <input type="text" id="name"
               placeholder="Enter Student Name">

        <h3>Enter Subject Marks</h3>

        <input type="number" id="m1" placeholder="Subject 1 Marks" min="0" max="100">
        <input type="number" id="m2" placeholder="Subject 2 Marks" min="0" max="100">
        <input type="number" id="m3" placeholder="Subject 3 Marks" min="0" max="100">
        <input type="number" id="m4" placeholder="Subject 4 Marks" min="0" max="100">
        <input type="number" id="m5" placeholder="Subject 5 Marks" min="0" max="100">

        <br>

        <button onclick="calculateMarks()">Calculate</button>

        <div id="result"></div>

    </div>

    <script>

        function calculateMarks() {

            let name = document.getElementById("name").value;

            let marks = [
                document.getElementById("m1").value,
                document.getElementById("m2").value,
                document.getElementById("m3").value,
                document.getElementById("m4").value,
                document.getElementById("m5").value
            ];

            if (name.trim() === "" || marks.some(m => m === "")) {
                alert("Please enter student name and all subject marks");
                return;
            }

            marks = marks.map(Number);

            if (marks.some(m => !Number.isFinite(m) || m < 0 || m > 100)) {
                alert("Please enter marks between 0 and 100");
                return;
            }

            let total = marks.reduce((a, b) => a + b, 0);

            let average = total / 5;

            let grade;

            if (average >= 90) {
                grade = "A";
            }
            else if (average >= 70) {
                grade = "B";
            }
            else if (average >= 50) {
                grade = "C";
            }
            else if (average >= 30) {
                grade = "D";
            }
            else {
                grade = "Fail";
            }

            document.getElementById("result").innerHTML =
                "<h3>Student Result</h3>" +
                "Name: " + name +
                "<br>Total Marks: " + total + " / 500" +
                "<br>Average: " + average.toFixed(2) +
                "<br>Grade: <b>" + grade + "</b>";
        }

    </script>

</body>
</html>
